# Public demo (synthetic data only). One service runs the API (:8787, internal) and the web app ($PORT, public);
# the web app proxies /api/* to the API. DATABASE_URL = hosted Postgres with pgvector (Tiger Cloud free plan):
# embedded PGlite needs ~350 MB on its own, too much next to Next.js on a 512 MB instance.
# No Ollama on Render: LLM_* point at a hosted Gemma endpoint (synthetic data only — real data stays in local mode).
services:
  - type: web
    name: pf-desk
    runtime: node
    plan: free  # no card needed; sleeps after 15 min idle (first visit then takes ~1 min)
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter web build
    # node directly (no pnpm wrapper processes): the free plan has 512 MB
    startCommand: (cd apps/api && node src/index.ts &) && cd apps/web && node_modules/.bin/next start -p $PORT
    healthCheckPath: /api/health
    domains:
      - pfdesk.buildwithyash.tech
    envVars:
      - { key: NODE_VERSION, value: "24" }
      - { key: DEMO_MODE, value: "true" }
      - { key: DATABASE_URL, sync: false }
      - { key: API_PORT, value: "8787" }
      - { key: API_URL, value: "http://127.0.0.1:8787" }
      - { key: PUBLIC_URL, value: "https://pfdesk.buildwithyash.tech" }
      - { key: TEMPORAL_WORKER, value: "off" }
      - { key: LLM_BASE_URL, value: "https://generativelanguage.googleapis.com/v1beta/openai" }
      - { key: LLM_MODEL, value: "gemma-4-26b-a4b-it" }
      - { key: LLM_COMPAT, value: "gemma-api" }
      - { key: LLM_API_KEY, sync: false }
      - { key: DECODER_MODEL, value: "gemma-4-26b-a4b-it" }
      - { key: SENTRY_DSN_API, sync: false }
      - { key: ELEVENLABS_AGENT_ID, sync: false }
      - { key: VOICE_SHARED_SECRET, sync: false }
